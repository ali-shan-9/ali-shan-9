name: Latest blog post workflow

# Auto-updates the "Latest Blog Posts" section in README.md by reading
# RSS feeds from blogging platforms. Runs hourly + on push to main.

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blog-post-workflow.yml"

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull in latest posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Replace placeholder URLs below with your actual blog feed URLs.
          # Common feeds:
          #   Dev.to:    https://dev.to/feed/<your-username>
          #   Medium:    https://medium.com/feed/@<your-username>
          #   Hashnode:  https://<your-blog>.hashnode.dev/rss.xml
          #   Personal:  https://<yoursite>.com/feed.xml
          feed_list: "https://dev.to/feed/ali-shan-9,https://medium.com/feed/@alishan7321"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
          template: "- [$title]($url) <sub><i>$date</i></sub>"
